<!-- 첫 화면: 페이지가 다 오기 전, 게임이 켜지기 전에 하얀 화면 대신 보이는 것 (느린 회선 / 느린 폰에서 몇 초씩 비어 보이던 시간).
     게임 스크립트(StoryScript)가 로딩 화면이나 타이틀을 띄울 때 body 에 bb-ready 를 붙여서 사라져. 문제가 생겨도 30초 뒤에는 저절로 사라져.
     index.html 의 <head> 맨 끝에 이 파일 내용이 들어 있어. Tweego 로 다시 빌드할 때는 --head=head.html 을 붙여야 들어가. (안 붙이면 이 첫 화면만 빠지고 게임은 그대로 돌아가) -->
<!-- 링크 미리보기(카톡, X 등)와 파비콘: 링크를 공유했을 때 뜨는 설명과 그림, 브라우저 탭 아이콘.
     og:image, og:url, twitter:image 의 주소는 실제 배포 주소(GitHub Pages)로 적어야 해. 주소가 바뀌면 이 세 곳만 고치면 돼.
     index.html 의 <head> 안에도 같은 줄이 들어 있어. (Tweego 로 다시 빌드할 때는 --head=head.html 이 이 파일을 넣어줌) -->

<script>document.documentElement.lang = 'ko';</script>
<style id="bb-splash">
html { background: #060c1c; }
body:not(.bb-ready)::before, body:not(.bb-ready)::after {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 2147483000;
  box-sizing: border-box;
  text-align: center;
  color: #fff;
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  pointer-events: none;
}
body:not(.bb-ready)::before {
  content: '귤복복 살인사건';
  top: 0;
  bottom: 0;
  padding-top: 43vh;
  background: #060c1c;
  font-size: 7vw;
  font-size: min(7vw, 3.94vh);
  font-weight: 700;
  letter-spacing: 0.02em;
}
body:not(.bb-ready)::after {
  content: '게임을 불러오는 중…';
  top: 52vh;
  font-size: 3.6vw;
  font-size: min(3.6vw, 2.02vh);
  opacity: 0.6;
  animation: bb-splash-blink 1.2s ease-in-out infinite;
}
@keyframes bb-splash-blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.75; } }
</style>
<noscript><style>body::before, body::after { display: none !important; }</style></noscript>
<script>setTimeout(function () { if (document.body) document.body.classList.add('bb-ready'); }, 30000);</script>
